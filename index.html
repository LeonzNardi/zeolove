<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeoLove</title>
  <style>
    body{margin:0;font-family:Arial, sans-serif;background:black;color:white;text-align:center;overflow-x:hidden}/* GLOW NAME */
.name{font-size:32px;margin-top:20px;animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{
  from{text-shadow:0 0 5px #ff9a9e,0 0 10px #ff9a9e}
  to{text-shadow:0 0 15px #fad0c4,0 0 25px #fad0c4}
}

/* FADE */
.fade{opacity:0;transform:translateY(20px);animation:fadeIn 1s ease forwards}
@keyframes fadeIn{to{opacity:1;transform:translateY(0)}}

.bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:.4}

.social{margin-top:20px;display:flex;justify-content:center;gap:30px}
.social-item{text-align:center}
.social img{width:45px;height:45px;object-fit:contain;cursor:pointer;transition:.3s}
.social img:hover{transform:scale(1.15)}
.social-name{margin-top:5px;font-size:14px}

.playlist{margin:20px;padding:15px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border-radius:15px;border:1px solid rgba(255,255,255,.2)}

/* SWIPE SLIDER */
.slider{position:relative;width:100%;overflow:hidden;margin-top:20px}
.slides{display:flex;transition:transform .4s ease}
.slides img{width:100%;height:300px;object-fit:cover}

.dots{margin-top:10px}
.dot{display:inline-block;width:8px;height:8px;background:#aaa;border-radius:50%;margin:4px}
.dot.active{background:white}

  </style>
</head>
<body><img src="/foto/background.png" class="bg"><div class="fade">
  <div class="name">ZeoLove</div>  <div class="social">
    <div class="social-item">
      <a href="https://instagram.com/leonardi_rahardian" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
      </a>
      <div class="social-name">Leonardi</div>
    </div><div class="social-item">
  <a href="https://instagram.com/z_mldaaa" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
  </a>
  <div class="social-name">Zahra</div>
</div>

  </div>
</div><div class="playlist fade">
  <h3>Playlist Leonardi</h3>
  <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/66ajbbyOvlUQRqULwYuBJk" width="100%" height="200"></iframe>
</div><div class="playlist fade">
  <h3>Playlist Zahra</h3>
  <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/7aSOkUWLGixeYPRT0To4pE" width="100%" height="200"></iframe>
</div><!-- SWIPE FOTO --><div class="slider fade" id="slider">
  <div class="slides" id="slides">
    <img src="/foto/foto1.png">
    <img src="/foto/foto2.png">
    <img src="/foto/foto3.png">
    <img src="/foto/foto4.png">
  </div>
</div><div class="dots" id="dots"></div><script>
  let index=0;
  const slides=document.getElementById('slides');
  const total=slides.children.length;
  const dotsContainer=document.getElementById('dots');

  // create dots
  for(let i=0;i<total;i++){
    const d=document.createElement('span');
    d.className='dot';
    dotsContainer.appendChild(d);
  }

  function update(){
    slides.style.transform=`translateX(-${index*100}%)`;
    document.querySelectorAll('.dot').forEach((d,i)=>{
      d.classList.toggle('active',i===index);
    });
  }

  // auto slide
  setInterval(()=>{
    index=(index+1)%total;
    update();
  },3000);

  update();
</script></body>
</html>
